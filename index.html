<title>HOMEZEE | هوم‌زی</title>
<style>
:root {
  --site-primary: #6D3B91;
  --site-secondary: #E9DDF2;
  --site-background: #F7F3FA;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--site-background);
  color: #2B2033;
  font-family: Tahoma, Arial, sans-serif;
}
main {
  width: min(100%, 420px);
  padding: 36px 24px;
  text-align: center;
  background: #fff;
  border: 1px solid #E8DDEC;
  border-radius: 28px;
  box-shadow: 0 18px 55px rgba(65,35,82,.10);
}
h1 {
  margin: 0;
  color: var(--site-primary);
  direction: ltr;
  font-size: 35px;
  font-weight: 900;
  letter-spacing: 3px;
}
.brand-fa {
  margin: 7px 0 24px;
  font-size: 27px;
  font-weight: 800;
}
.rule {
  width: 64px;
  height: 4px;
  margin: 0 auto 26px;
  border-radius: 9px;
  background: var(--site-secondary);
}
.actions { display: grid; gap: 14px; }
.action {
  min-height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 14px 18px;
  border-radius: 16px;
  background: var(--site-primary);
  color: white;
  text-decoration: none;
  font-size: 17px;
  font-weight: 700;
}
.action:focus-visible { outline: 3px solid #D6B8E8; outline-offset: 3px; }
.action svg { width: 23px; height: 23px; }
footer { margin-top: 26px; color: #887894; font-size: 12px; }
</style>
</head>
